<style>
:root {
  --bg: #0a0c10;
  --panel: #11151c;
  --line: #1e2530;
  --ink: #e8edf4;
  --ink-dim: #8b95a6;
  --sev-critical: #ff5a5f;
  --sev-high: #ff9f43;
  --sev-medium: #ffd666;
  --sev-low: #4dabf7;
  --sev-info: #8b95a6;
  --sev-new: #c792ea;
  --true-positive: #3ddc84;
  --paper: #f4f1ea;
  --paper-ink: #14120e;
  --paper-red: #b3261e;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: "Archivo Black", system-ui, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--sev-critical); color: var(--bg); }
a { color: inherit; }
/* faint CRT scanlines over the dark world */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0, 0, 0, 0.18) 2px 3px);
  opacity: 0.35;
  mix-blend-mode: overlay;
}

/* ---------- hero ---------- */
.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--line);
}
.chrome {
  display: flex;
  justify-content: space-between;
  gap: 1rem 2rem;
  flex-wrap: wrap;
  padding: 0.6rem 1.25rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.6875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.hero-core {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3rem 1.25rem 2rem;
  max-width: 72rem;
  margin: 0 auto;
  width: 100%;
}
.counter {
  color: var(--sev-critical);
  font-weight: 700;
  font-size: clamp(0.8125rem, 1.6vw, 1rem);
  letter-spacing: 0.12em;
}
.counter::before {
  content: "●";
  margin-right: 0.6em;
  animation: blink 1.4s steps(2, start) infinite;
}
.hero h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3.5rem, 17vw, 12rem);
  line-height: 0.9;
  letter-spacing: -0.02em;
  margin: 1.5rem 0 1.25rem;
  text-wrap: balance;
}
.sub {
  color: var(--ink-dim);
  font-size: clamp(1rem, 2.2vw, 1.375rem);
}
.scroll-cue {
  padding: 0 1.25rem 1.5rem;
  max-width: 72rem;
  margin: 0 auto;
  width: 100%;
  color: var(--ink-dim);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  animation: bob 2.2s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.25; } }
@keyframes bob { 50% { transform: translateY(0.4rem); } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .counter::before, .scroll-cue { animation: none; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="chrome" role="presentation">
    <span class="chrome-title">Unified Security Operations Console v4.7.2 — end of life</span>
    <span class="chrome-copy">© 1997–2026 · still in production</span>
  </div>
  <div class="hero-core">
    <p class="counter"><span id="alert-count">47,832</span> open alerts</p>
    <h1>SOC sucks.</h1>
    <p class="sub">We know it does. So do you.</p>
  </div>
  <p class="scroll-cue" aria-hidden="true">▾ begin triage</p>
</header>
<main>
</main>
</body>
</html>
